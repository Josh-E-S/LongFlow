[project]
name = "longflow"
version = "0.1.0"
description = "Fast, emotion-controllable, drift-free long-form TTS on a frozen VibeVoice backbone"
requires-python = ">=3.11"
# Runtime deps are pinned in requirements/ per environment (local dev vs GPU box)
# once the resource research in docs/resources.md is finalized.
dependencies = [
    "numpy>=2.4.6",
    "soundfile>=0.14.0",
    "torch>=2.12.1",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pre-commit>=3.7",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tier 1 (fast, synthetic, no GPU) runs by default; tiers are opt-in:
#   uv run pytest -m slow        -> tier 2 (e.g. 1-clip overfit gate, needs GPU)
# Tier 3 gate checks are experiments, not tests -- see experiments/NOTES-template.md
addopts = "-m 'not slow and not gpu'"
markers = [
    "slow: integration tests that train/decode; run manually before training runs",
    "gpu: requires CUDA; run on the Vast.ai box, not locally",
]
