[project]
name = "longflow"
version = "0.1.0"
description = "Fast, emotion-controllable, drift-free long-form TTS on a frozen VibeVoice backbone"
requires-python = ">=3.11"
# Runtime deps are pinned in requirements/ per environment (local dev vs GPU box)
# once the resource research in docs/resources.md is finalized.
dependencies = [
    "torch>=2.12.1",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pre-commit>=3.7",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
